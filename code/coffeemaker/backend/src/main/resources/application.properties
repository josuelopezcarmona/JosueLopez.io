# Each ${NAME:default} reads an environment variable and falls back to the value
# after the colon when it is not set.  A freshly cloned repository therefore runs
# against a local MySQL with no editing, and CI supplies its own host and password
# through the environment rather than rewriting this file.

# Optional per-developer overrides.  See .env.template.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=coffee_maker
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/coffee_maker?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Close the JPA session at the end of the service call rather than holding it
# open until the HTTP response is rendered.  Leaving it open (the Spring Boot
# default) lets a controller or a JSON serializer trigger extra queries after
# the service layer thinks it is finished, which hides where the queries come
# from.  Spring Boot warns about this on every start-up when it is left on.
spring.jpa.open-in-view=false
